name = "hot-tub-elite-leads"
main = "worker.js"
compatibility_date = "2025-01-01"

[vars]
# Exact origin of the published site. The worker rejects lead submissions from
# anywhere else, so this must be updated together with the site's domain —
# `python3 set-domain.py <domain>` in the repo root does both.
ALLOWED_ORIGIN = "https://vladdavydov263-spec.github.io"

# Target chat: the Telegram group leads are posted into.
# Not a secret — a chat id is useless without the bot token, which is why this
# sits here in plain sight while the token does not.
# Bot: @loghottube_bot
TELEGRAM_CHAT_ID = "-1003956851336"

# The bot token is the one real secret. It is NOT stored in this file or anywhere
# else in the repo — GitHub would detect it and Telegram would revoke it. Set it
# once, straight from BotFather into Cloudflare:
#
#   npx wrangler secret put TELEGRAM_BOT_TOKEN
#
# It prompts, you paste, and the value goes to Cloudflare without touching the repo.
